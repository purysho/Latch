[package]
name = "latch-desktop"
version = "0.1.0"
description = "Latch local authorization control plane"
authors = ["Purysho"]
edition = "2021"
license = "MIT"

[lib]
name = "latch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
latch-core = { path = "../../../crates/latch-core" }
